name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: local-spec-search

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: local-spec-search/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m build
      - run: twine check dist/*
      - name: Install built wheel and retest (not editable source)
        shell: bash
        run: |
          python -m pip uninstall -y local-spec-search
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -p "test_*.py"
      - name: Verify public Git URL installation
        run: python -m pip install --force-reinstall --no-deps "git+https://github.com/Iris-cys/open_coding.git@${{ github.sha }}#subdirectory=local-spec-search"
