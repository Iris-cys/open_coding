[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-spec-search"
version = "2.2.0"
description = "Offline, evidence-first search and MCP access for long technical PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Iris-cys"}]
keywords = ["mcp", "pdf", "search", "retrieval", "vscode", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "PyMuPDF>=1.26.6,<1.27",
  "scikit-learn>=1.8.0,<1.9",
  "numpy>=2.3.5,<3",
  "scipy>=1.17.0,<2",
]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "ruff>=0.13,<1", "twine>=6.2,<7"]

[project.scripts]
spec-search = "spec_search.cli:main"
spec-search-mcp = "spec_search.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Iris-cys/local-spec-search"
Repository = "https://github.com/Iris-cys/local-spec-search"
Issues = "https://github.com/Iris-cys/local-spec-search/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
